<!DOCTYPE html>
<html>
<head>
  <script src="https://unpkg.com/bpmn-js@11.5.0/dist/bpmn-viewer.development.js"></script>
</head>
<body>
  <div id="canvas" style="height: 500px;"></div>
  <script>
    const xml = $(Get-Content bpmn_test.xml -Raw);
    const viewer = new BpmnJS({ container: '#canvas' });
    viewer.importXML(xml).then(() => console.log('SUCCESS')).catch(err => console.error('BPMN JS ERROR:', err));
  </script>
</body>
</html>
