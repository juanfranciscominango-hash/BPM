server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy para el backend
    location /api/v1 {
        # Resolver de DNS para Kubernetes/Docker. 
        # 127.0.0.11 es el por defecto de Docker.
        resolver 127.0.0.11 valid=30s;
        
        # Al usar una variable, Nginx no valida la existencia del host al iniciar.
        set $backend_host bmp-backend;
        
        proxy_pass http://$backend_host:9091/api/v1;
        proxy_set_header Host $backend_host:9091; # Usar el host destino para evitar bucles
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
