<div class="container py-5" style="max-width: 900px;">
  <div class="text-center mb-5">
    <div class="bg-success text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3 shadow-sm" style="width: 80px; height: 80px;">
      <i class="bi bi-check-lg fs-1"></i>
    </div>
    <h1 class="fw-bold text-dark">¡Proceso Finalizado!</h1>
    <p class="text-muted fs-5">Tu solicitud de crédito ha concluido exitosamente.</p>
  </div>

  <div class="card border-0 shadow-lg rounded-4 overflow-hidden mb-4">
    <div class="card-header bg-primary text-white py-3 px-4">
      <h5 class="mb-0"><i class="bi bi-file-earmark-text me-2"></i>Resumen de Aprobación</h5>
    </div>
    <div class="card-body p-4 bg-light">
      <div class="row g-4">
        <div class="col-md-6">
          <div class="p-3 bg-white rounded-3 shadow-sm border border-light">
            <small class="text-muted text-uppercase fw-bold">Instancia</small>
            <h5 class="mb-0 mt-1 text-dark">{{ processInstanceId || 'N/A' }}</h5>
          </div>
        </div>
        <div class="col-md-6">
          <div class="p-3 bg-white rounded-3 shadow-sm border border-light">
            <small class="text-muted text-uppercase fw-bold">Estado</small>
            <h5 class="mb-0 mt-1 text-success"><i class="bi bi-circle-fill small me-2"></i>{{ resumen.estado }}</h5>
          </div>
        </div>
        <div class="col-md-4">
          <div class="p-3 bg-white rounded-3 shadow-sm border border-light text-center">
            <small class="text-muted text-uppercase fw-bold d-block mb-2">Monto Aprobado</small>
            <h3 class="mb-0 text-primary fw-bold">${{ resumen.montoAprobado | number:'1.2-2' }}</h3>
          </div>
        </div>
        <div class="col-md-4">
          <div class="p-3 bg-white rounded-3 shadow-sm border border-light text-center">
            <small class="text-muted text-uppercase fw-bold d-block mb-2">Plazo</small>
            <h3 class="mb-0 text-dark fw-bold">{{ resumen.plazo }} <span class="fs-6 text-muted fw-normal">meses</span></h3>
          </div>
        </div>
        <div class="col-md-4">
          <div class="p-3 bg-white rounded-3 shadow-sm border border-light text-center">
            <small class="text-muted text-uppercase fw-bold d-block mb-2">Tasa Anual</small>
            <h3 class="mb-0 text-dark fw-bold">{{ resumen.tasa }}<span class="fs-6 text-muted fw-normal">%</span></h3>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-md-6">
      <button class="btn btn-primary-premium w-100 py-3 rounded-4 shadow-sm fw-bold d-flex align-items-center justify-content-center" (click)="descargarContrato()">
        <i class="bi bi-cloud-download fs-5 me-2"></i>Descargar Contrato PDF
      </button>
    </div>
    <div class="col-md-6">
      <button class="btn btn-light w-100 py-3 rounded-4 shadow-sm border fw-bold text-muted d-flex align-items-center justify-content-center" routerLink="/portal/historial">
        <i class="bi bi-clock-history fs-5 me-2"></i>Ir a mi Historial
      </button>
    </div>
  </div>
</div>
